<!-- Entorno 3D con Cuadrícula y Dinámica de Luces -->
<div class="space-grid-environment">
  <div class="grid-floor-3d"></div>
  <div class="ambient-flame-light"></div>
  <div class="interactive-light-aura" 
       [style.left.%]="mouseX()" 
       [style.top.%]="mouseY()">
  </div>
</div>

<main class="ignis-dashboard">
  <div class="dashboard-wrapper">
    <!-- Barra de navegación y HUD técnico -->
    <app-header></app-header>

    <!-- Fila Superior: Viewport 3D y Controles Físicos -->
    <section class="upper-grid-section">
      <div class="viewport-col">
        <app-grid-viewport></app-grid-viewport>
      </div>
      <div class="controls-col">
        <app-scenario-controls></app-scenario-controls>
      </div>
    </section>

    <!-- Sección Central: Fire Evidence Card -->
    <section class="evidence-section">
      <app-evidence-card></app-evidence-card>
    </section>

    <!-- Sección Inferior: Triada de Evidencia -->
    <section class="triad-section">
      <app-knowledge-triad></app-knowledge-triad>
    </section>

    <!-- Pie de página técnico estilo Apple -->
    <footer class="ios-footer ios-card">
      <div class="footer-block">
        <span class="nasa-pill">NASA</span>
        <span>Space Apps Challenge 2026 · <em>Flame in Freefall</em></span>
      </div>
      <div class="footer-block center-block">
        <span>Datos empíricos: Physical Sciences Informatics (PSI-69, PSI-25, PSI-98, Saffire VI)</span>
      </div>
      <div class="footer-block">
        <span>Licencia Abierta CC0-1.0 · Causal Engine v1.0</span>
      </div>
    </footer>
  </div>
</main>

<!-- Drawer / Hoja lateral para acciones científicas -->
<app-action-drawer></app-action-drawer>
