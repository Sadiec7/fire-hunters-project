name: IGNIS-mu Scientific & Distributed CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install numpy pandas pyarrow requests
      - name: Run Scientific Reproducibility & Gate Tests
        run: python back/tests_ci_ignis.py