version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fire-hunters-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fire_hunters_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fire_hunters_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./back
    container_name: fire-hunters-backend
    restart: unless-stopped
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./back:/usr/app
      - /usr/app/node_modules
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=fire_hunters_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./front
    container_name: fire-hunters-frontend
    restart: unless-stopped
    command: sh -c "npm install && npm start"
    ports:
      - "4200:4200"
    volumes:
      - ./front:/usr/app
      - /usr/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
