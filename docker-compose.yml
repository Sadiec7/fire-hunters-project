services:
  earth-node:
    build: .
    image: pyro-ray-ligero:latest
    container_name: vm1-earth-node
    env_file:
      - .env
    environment:
      - VM_ROLE=EARTH
    ports:
      - "8001:8001"
    volumes:
      - ./back:/workspace
      - ./ia:/workspace/ia
    working_dir: /workspace
    networks:
      ignis-net:
        aliases:
          - earth-node
    command: python /workspace/arquitectura_vms.py

  comm-node:
    image: pyro-ray-ligero:latest
    container_name: vm2-comm-node
    environment:
      - VM_ROLE=COMM
    ports:
      - "8002:8002"
    depends_on:
      - earth-node
    volumes:
      - ./back:/workspace
      - ./ia:/workspace/ia
    working_dir: /workspace
    networks:
      ignis-net:
        aliases:
          - comm-node
    command: python /workspace/arquitectura_vms.py

  spacecraft-node:
    image: pyro-ray-ligero:latest
    container_name: vm3-spacecraft-node
    shm_size: "2g"
    environment:
      - VM_ROLE=SPACECRAFT
    ports:
      - "8000:8000"
      - "8265:8265"
      - "10001:10001"
    depends_on:
      - comm-node
    volumes:
      - ./back:/workspace
      - ./ia:/workspace/ia
    working_dir: /workspace
    networks:
      ignis-net:
        aliases:
          - spacecraft-node
    command: bash -c "ray start --head --port=6379 --num-cpus=0 --dashboard-host=0.0.0.0 && sleep 2 && python /workspace/arquitectura_vms.py"

  ray-worker:
    image: pyro-ray-ligero:latest
    shm_size: "2g"
    depends_on:
      - spacecraft-node
    volumes:
      - ./back:/workspace
      - ./ia:/workspace/ia
    working_dir: /workspace
    networks:
      ignis-net:
    command: bash -c "sleep 4 && ray start --address=spacecraft-node:6379 --num-cpus=2 --block"

  prometheus:
    image: prom/prometheus:latest
    container_name: ignis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - spacecraft-node
    networks:
      ignis-net:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: ignis-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      ignis-net:

networks:
  ignis-net:
    name: ignis-net
    driver: bridge
